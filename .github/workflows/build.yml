name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: theos
        run: |
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          git clone --recursive https://github.com/theos/theos.git $HOME/theos

      - name: crear archivos
        run: |
          cat > ianSak.m <<'EOF'
          // ianSak.m — menú flotante + multiplicador de líneas (8 Ball Pool)
          #import <UIKit/UIKit.h>
          #import <objc/runtime.h>

          static BOOL gLines = NO;
          static float gMult = 4.0f;
          static NSMutableSet *gDone;
          static UIWindow *gWin;

          typedef float (*imp_f)(id, SEL);
          typedef void  (*imp_vf)(id, SEL, float);

          static void save(void) {
              NSUserDefaults *d = [NSUserDefaults standardUserDefaults];
              [d setBool:gLines forKey:@"ianSak.lines"];
              [d setFloat:gMult forKey:@"ianSak.mult"];
          }

          static void hook(Class c, Method m) {
              NSString *k = [NSString stringWithFormat:@"%s|%s", class_getName(c), sel_getName(method_getName(m))];
              if ([gDone containsObject:k]) return;
              [gDone addObject:k];
              SEL sel = method_getName(m);
              IMP orig = method_getImplementation(m);
              NSMethodSignature *sig = [NSMethodSignature signatureWithObjCTypes:method_getTypeEncoding(m)];
              if (sig.numberOfArguments == 2 && sig.methodReturnType[0] == 'f') {
                  method_setImplementation(m, imp_implementationWithBlock(^float(id s) {
                      float v = ((imp_f)orig)(s, sel);
                      return gLines ? v * gMult : v;
                  }));
              } else if (sig.numberOfArguments == 3 && strcmp(sig.methodReturnType, "v") == 0
                         && sig.getArgumentTypeAtIndex(2)[0] == 'f') {
                  method_setImplementation(m, imp_implementationWithBlock(^(id s, float v) {
                      ((imp_vf)orig)(s, sel, gLines ? v * gMult : v);
                  }));
              }
          }

          static void scan(void) {
              unsigned int n = 0;
              Class *cls = objc_copyClassList(&n);
              for (unsigned i = 0; i < n; i++) {
                  NSString *cn = [@(class_getName(cls[i])) lowercaseString];
                  if (!([cn containsString:@"guideline"] || [cn containsString:@"aim"] ||
                        [cn containsString:@"trajectory"] || [cn containsString:@"aimline"])) continue;
                  unsigned int mc = 0;
                  Method *ms = class_copyMethodList(cls[i], &mc);
                  for (unsigned j = 0; j < mc; j++) {
                      NSString *sn = [@(sel_getName(method_getName(ms[j]))) lowercaseString];
                      if (!([sn containsString:@"guideline"] || [sn containsString:@"length"] ||
                            [sn containsString:@"aim"])) continue;
                      hook(cls[i], ms[j]);
                  }
                  free(ms);
              }
              free(cls);
          }

          @interface PassWin : UIWindow @end
          @implementation PassWin
          - (UIView *)hitTest:(CGPoint)p withEvent:(UIEvent *)e {
              UIView *v = [super hitTest:p withEvent:e];
              return v == self.rootViewController.view ? nil : v;
          }
          @end

          @interface MenuVC : UIViewController
          @property (nonatomic, strong) UIView *panel;
          @property (nonatomic, strong) UILabel *multLabel;
          @property (nonatomic, strong) UIButton *fab;
          @end

          @implementation MenuVC
          - (void)viewDidLoad {
              [super viewDidLoad];
              self.view.backgroundColor = [UIColor clearColor];
              _fab = [UIButton buttonWithType:UIButtonTypeSystem];
              _fab.frame = CGRectMake(12, 120, 54, 54);
              _fab.backgroundColor = [[UIColor blackColor] colorWithAlphaComponent:0.75];
              _fab.layer.cornerRadius = 27;
              [_fab setTitle:@"iS" forState:UIControlStateNormal];
              [_fab setTitleColor:[UIColor greenColor] forState:UIControlStateNormal];
              [_fab addTarget:self action:@selector(tap) forControlEvents:UIControlEventTouchUpInside];
              [_fab addGestureRecognizer:[[UIPanGestureRecognizer alloc] initWithTarget:self action:@selector(pan:)]];
              [self.view addSubview:_fab];
              _panel = [[UIView alloc] initWithFrame:CGRectMake(12, 184, 250, 156)];
              _panel.backgroundColor = [[UIColor blackColor] colorWithAlphaComponent:0.88];
              _panel.layer.cornerRadius = 12;
              _panel.hidden = YES;
              [self.view addSubview:_panel];
              UILabel *t = [[UILabel alloc] initWithFrame:CGRectMake(12, 8, 220, 20)];
              t.text = @"ianSak — 8BP";
              t.textColor = [UIColor greenColor];
              t.font = [UIFont boldSystemFontOfSize:13];
              [_panel addSubview:t];
              UISwitch *sw = [[UISwitch alloc] initWithFrame:CGRectMake(12, 36, 51, 31)];
              sw.on = gLines;
              [sw addTarget:self action:@selector(linesChanged:) forControlEvents:UIControlEventValueChanged];
              [_panel addSubview:sw];
              UILabel *sl = [[UILabel alloc] initWithFrame:CGRectMake(72, 40, 160, 20)];
              sl.text = @"Líneas largas";
              sl.textColor = [UIColor whiteColor];
              sl.font = [UIFont systemFontOfSize:13];
              [_panel addSubview:sl];
              UISlider *sd = [[UISlider alloc] initWithFrame:CGRectMake(12, 80, 226, 30)];
              sd.minimumValue = 1; sd.maximumValue = 10; sd.value = gMult;
              [sd addTarget:self action:@selector(multChanged:) forControlEvents:UIControlEventValueChanged];
              [_panel addSubview:sd];
              _multLabel = [[UILabel alloc] initWithFrame:CGRectMake(12, 112, 226, 20)];
              _multLabel.text = [NSString stringWithFormat:@"Multiplicador: %.0fx", gMult];
              _multLabel.textColor = [UIColor lightGrayColor];
              _multLabel.font = [UIFont systemFontOfSize:12];
              [_panel addSubview:_multLabel];
              UIButton *re = [UIButton buttonWithType:UIButtonTypeSystem];
              re.frame = CGRectMake(12, 130, 226, 20);
              [re setTitle:@"Re-escanear" forState:UIControlStateNormal];
              [re setTitleColor:[UIColor greenColor] forState:UIControlStateNormal];
              [re addTarget:self action:@selector(rescan) forControlEvents:UIControlEventTouchUpInside];
              [_panel addSubview:re];
          }
          - (void)tap { _panel.hidden = !_panel.hidden; }
          - (void)pan:(UIPanGestureRecognizer *)g {
              CGPoint p = [g translationInView:self.view];
              _fab.center = CGPointMake(_fab.center.x + p.x, _fab.center.y + p.y);
              [g setTranslation:CGPointZero inView:self.view];
              _panel.frame = CGRectMake(_fab.frame.origin.x, _fab.frame.origin.y + 64, 250, 156);
          }
          - (void)linesChanged:(UISwitch *)s { gLines = s.on; save(); }
          - (void)multChanged:(UISlider *)s {
              gMult = s.value;
              _multLabel.text = [NSString stringWithFormat:@"Multiplicador: %.0fx", gMult];
              save();
          }
          - (void)rescan { scan(); }
          @end

          __attribute__((constructor)) static void init(void) {
              gDone = [NSMutableSet new];
              NSUserDefaults *d = [NSUserDefaults standardUserDefaults];
              gLines = [d boolForKey:@"ianSak.lines"];
              float m = [d floatForKey:@"ianSak.mult"];
              if (m > 0) gMult = m;
              [[NSNotificationCenter defaultCenter] addObserverForName:UIApplicationDidFinishLaunchingNotification
                                                                object:nil queue:[NSOperationQueue mainQueue]
                                                            usingBlock:^(NSNotification *n) {
                  gWin = [[PassWin alloc] initWithFrame:[UIScreen mainScreen].bounds];
                  gWin.windowLevel = UIWindowLevelAlert + 1;
                  gWin.backgroundColor = [UIColor clearColor];
                  gWin.rootViewController = [MenuVC new];
                  [gWin makeKeyAndVisible];
                  for (int i = 0; i < 8; i++) {
                      dispatch_after(dispatch_time(DISPATCH_TIME_NOW, (int64_t)(2.0 * i * NSEC_PER_SEC)),
                                     dispatch_get_main_queue(), ^{ scan(); });
                  }
              }];
          }
          EOF

          cat > Makefile <<'EOF'
          TARGET := iphone:clang:latest:15.0
          ARCHS = arm64
          include $(THEOS)/makefiles/common.mk
          TWEAK_NAME = ianSak
          ianSak_FILES = ianSak.m
          ianSak_FRAMEWORKS = UIKit Foundation
          include $(THEOS)/makefiles/tweak.mk
          EOF

          cat > control <<'EOF'
          Package: com.iansak.8bp
          Name: ianSak
          Version: 0.1
          Architecture: iphoneos-arm
          Description: Menu flotante y lineas largas
          Maintainer: ianSak
          EOF

      - name: build
        run: make package FINALPACKAGE=1

      - uses: actions/upload-artifact@v4
        with:
          name: ianSak-dylib
          path: |
            .theos/obj/debug/arm64/ianSak.dylib
            .theos/packages/*.deb
          if-no-files-found: warn
